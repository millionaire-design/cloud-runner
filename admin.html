<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Submissions</title>
    <style>
        :root {
            /* REPLACE THE URL BELOW TO CHANGE YOUR BACKGROUND PHOTO */
            --bg-image: url('https://i.postimg.cc/ryNgkgCD/Purple-and-White-Gradient-Sunset-at-Beach-i-OS-Home-Screen.png'); 
            
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(15, 15, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: var(--bg-image);
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 240px 20px 40px 20px; 
        }

        .dashboard-header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
            border-left: 4px solid var(--neon-purple);
        }

        .dashboard-header h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            font-size: 0.9rem;
        }

        .stat-badge span {
            color: var(--neon-cyan);
            font-weight: bold;
            margin-left: 5px;
        }

        .table-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            overflow-x: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-cyan);
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .view-docs-btn {
            background: transparent;
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .view-docs-btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.4);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .approve-btn, .reject-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s;
        }

        .approve-btn {
            background: linear-gradient(90deg, #00b09b, #96c93d);
        }

        .approve-btn:hover {
            box-shadow: 0 0 15px rgba(150, 201, 61, 0.5);
        }

        .reject-btn {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
        }

        .reject-btn:hover {
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .status-approved {
            background: rgba(150, 201, 61, 0.2);
            color: #96c93d;
            border: 1px solid #96c93d;
        }

        .status-rejected {
            background: rgba(255, 65, 108, 0.2);
            color: #ff416c;
            border: 1px solid #ff416c;
        }

    </style>
</head>
<body>

    <div class="dashboard-header">
        <h1>Admin Control Panel</h1>
        <div class="stats">
            <div class="stat-badge">Pending Reviews: <span id="pendingCount">0</span></div>
            <div class="stat-badge">Total Approved: <span id="approvedCount">0</span></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Contact Info</th>
                    <th>Birthday</th>
                    <th>Documents</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="entriesBody">
                <!-- Data will be dynamically injected here via JS -->
            </tbody>
        </table>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://isyvdecnquthfmyyuljf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzeXZkZWNucXV0aGZteXl1bGpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMTgwMzIsImV4cCI6MjA5MTc5NDAzMn0.xSS3PC-yKKqzcm8sKbuAc1Fl00ndQBy_WuoxJirTtoI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch submissions from Supabase and render the table
        async function loadSubmissions() {
            const { data, error } = await supabase
                .from('cloud_runner_submissions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching data: ", error);
                return;
            }

            const tbody = document.getElementById('entriesBody');
            tbody.innerHTML = ''; // Clear out the loading or old rows

            let pendingCount = 0;
            let approvedCount = 0;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No submissions found.</td></tr>';
                return;
            }

            data.forEach(entry => {
                // Tally stats
                if (entry.status === 'pending') pendingCount++;
                if (entry.status === 'approved') approvedCount++;

                // Format the Date
                const dateObj = new Date(entry.created_at);
                const formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

                // Define status class/text based on db state
                let statusClass = 'status-pending';
                let statusText = 'Pending';
                if (entry.status === 'approved') {
                    statusClass = 'status-approved';
                    statusText = 'Approved';
                } else if (entry.status === 'rejected') {
                    statusClass = 'status-rejected';
                    statusText = 'Rejected';
                }

                // Create the table row dynamically
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>${entry.full_name}</td>
                    <td>
                        ${entry.email}<br>
                        <span style="color: #aaa; font-size: 0.8rem;">${entry.phone}</span>
                    </td>
                    <td>${entry.birthday}</td>
                    <td>
                        <button class="view-docs-btn" onclick="window.open('${entry.id_front_url}', '_blank')">ID Front</button><br>
                        <button class="view-docs-btn" style="margin-top:5px;" onclick="window.open('${entry.id_back_url}', '_blank')">ID Back</button><br>
                        <button class="view-docs-btn" style="margin-top:5px;" onclick="window.open('${entry.headshot_url}', '_blank')">Headshot</button>
                    </td>
                    <td>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </td>
                    <td>
                        <div class="action-btns">
                            <button class="approve-btn" onclick="updateStatus('${entry.id}', 'approved')">Approve</button>
                            <button class="reject-btn" onclick="updateStatus('${entry.id}', 'rejected')">Reject</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Update top stats
            document.getElementById('pendingCount').textContent = pendingCount;
            document.getElementById('approvedCount').textContent = approvedCount;
        }

        // Update entry status in Supabase
        async function updateStatus(id, newStatus) {
            const { error } = await supabase
                .from('cloud_runner_submissions')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) {
                alert('Error updating status: ' + error.message);
                console.error(error);
            } else {
                loadSubmissions(); // Refresh table to reflect changes
            }
        }

        // Load entries when page loads
        document.addEventListener('DOMContentLoaded', loadSubmissions);
    </script>
</body>
</html>
